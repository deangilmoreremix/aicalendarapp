# Supabase CLI configuration for the AI Calendar remote app.
# Generated to make this repo a valid Supabase project root.
# Local dev: `npx supabase start`  |  Deploy: `npx supabase login` then `npx supabase link --project-ref <ref>`
project_id = "aicalendarapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://calendar.smartcrm.vip"
additional_redirect_urls = ["http://localhost:4173", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspect_mode = "session"

[analytics]
enabled = false
